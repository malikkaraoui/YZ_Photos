<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YZPhotos — Onboarding</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --carmine:#B23A5D;--storm:#3D5A6C;--gold:#D2A53F;--confetti:#E88AA0;--sulphur:#C3D24A;--mandarin:#E87B3E;
  --keep:#B6D84B;--trash:#F06A8C;
  --gbrd:rgba(255,255,255,.42);
  --grim:inset 0 .5px .5px rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.16);
  --gdrop:0 8px 24px rgba(8,28,38,.32);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

.glass-o{background:rgba(255,255,255,.14);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:.5px solid var(--gbrd);box-shadow:var(--grim),var(--gdrop)}

/* stage */
.onb-stage{height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(160deg,#3A5C6E 0%,#244252 45%,#152D3A 100%);padding:26px 30px 34px;align-items:center}
.onb-blobs{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(40% 32% at 16% 18%, rgba(232,123,62,.5), transparent 70%),
  radial-gradient(36% 30% at 86% 14%, rgba(195,210,74,.4), transparent 70%),
  radial-gradient(46% 38% at 88% 88%, rgba(178,58,93,.46), transparent 72%),
  radial-gradient(40% 34% at 10% 90%, rgba(232,138,160,.4), transparent 72%);filter:blur(8px)}
.onb-head{position:relative;z-index:2;display:flex;align-items:center;gap:12px;margin-bottom:22px;align-self:flex-start}
.onb-logo{font-size:17px;font-weight:700;color:#fff}
.onb-pill{font-size:12px;font-weight:600;color:#fff;padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.18);border:.5px solid rgba(255,255,255,.35)}
.onb-phone{position:relative;z-index:1;width:390px;height:812px;border-radius:54px;padding:11px;flex-shrink:0;
  background:linear-gradient(160deg,rgba(255,255,255,.25),rgba(255,255,255,.05));
  box-shadow:0 0 0 1.5px rgba(255,255,255,.35),0 40px 90px rgba(0,0,0,.45)}
.onb-phone-screen{width:100%;height:100%;border-radius:44px;overflow:hidden;position:relative;background:#16323f}

/* onboarding root */
.ob-root{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff;overflow:hidden;
  background:linear-gradient(165deg,#3A5C6E 0%,#244252 50%,#13303d 100%)}
.ob-bg{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(50% 38% at 80% 8%, rgba(232,123,62,.5), transparent 70%),
  radial-gradient(46% 36% at 12% 30%, rgba(195,210,74,.34), transparent 70%),
  radial-gradient(54% 44% at 88% 92%, rgba(178,58,93,.5), transparent 72%),
  radial-gradient(48% 40% at 8% 88%, rgba(232,138,160,.42), transparent 72%);filter:blur(6px)}
.ob-statusbar{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:16px 28px 0;font-size:14px;font-weight:600}
.ob-sb-r{display:flex;align-items:center;gap:6px}
.ob-skip{position:absolute;top:52px;right:24px;z-index:6;background:transparent;border:none;color:rgba(255,255,255,.8);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .3s}

/* track */
.ob-track{position:relative;z-index:2;flex:1;display:flex;min-height:0;touch-action:pan-y}
.ob-slide{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 34px;gap:20px}

/* hero zone */
.ob-hero{position:relative;width:100%;height:300px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* hero 1 : app icon */
.ob-hero-icon .ob-appicon{width:150px;height:150px;border-radius:34px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.18);animation:obFloat 4s ease-in-out infinite}
.ob-hero-icon .ob-appicon img{width:100%;height:100%;display:block}
.ob-spark{position:absolute;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 16px 4px rgba(255,255,255,.5)}
.ob-spark.s1{width:10px;height:10px;top:48px;left:78px;animation:obTwinkle 2.6s ease-in-out infinite}
.ob-spark.s2{width:7px;height:7px;top:210px;right:86px;animation:obTwinkle 2.6s ease-in-out infinite .8s}
.ob-spark.s3{width:5px;height:5px;top:120px;right:70px;animation:obTwinkle 2.6s ease-in-out infinite 1.5s}
@keyframes obFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes obTwinkle{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}

/* hero 2 : iPad + sources (câble + réseau) */
.ob-hero-ssd{flex-direction:column}
.ob-ipad-mini{position:relative;width:188px;height:138px;border-radius:20px;padding:9px;
  background:linear-gradient(160deg,#23323b,#16242c);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.32),0 18px 40px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.2);
  animation:obFloat 4s ease-in-out infinite}
.ob-ipad-screen{width:100%;height:100%;border-radius:11px;overflow:hidden;background:#16242c}
.ob-dash{width:100%;height:100%;padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.ob-dash-head{display:flex;align-items:center;justify-content:space-between}
.ob-dash-title{width:54px;height:8px;border-radius:4px;background:rgba(255,255,255,.85)}
.ob-dash-drive{display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.12)}
.ob-dash-led{width:6px;height:6px;border-radius:50%;background:var(--keep);box-shadow:0 0 7px 1px var(--keep);animation:obBlink 2s ease-in-out infinite}
@keyframes obBlink{0%,100%{opacity:1}50%{opacity:.4}}
.ob-dash-stats{display:flex;gap:7px}
.ob-dash-stat{flex:1;background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.18);border-radius:8px;padding:8px 9px;display:flex;flex-direction:column;gap:5px}
.ob-dash-stat b{width:70%;height:11px;border-radius:3px;background:rgba(255,255,255,.8)}
.ob-dash-stat i{width:48%;height:5px;border-radius:3px;background:rgba(255,255,255,.4)}
.ob-dash-bar{margin-top:auto;height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.ob-dash-bar span{display:block;width:64%;height:100%;border-radius:5px;background:linear-gradient(90deg,#C3D24A,#B6D84B)}
.ob-ipad-cam{position:absolute;top:50%;right:3px;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.4)}
.ob-conn{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 14px;border-radius:16px;font-size:12px;font-weight:700;color:#fff}
.ob-conn-cable{left:8px;bottom:24px;animation:obFloat 4.4s ease-in-out infinite .3s}
.ob-conn-net{right:8px;bottom:24px;animation:obFloat 4.4s ease-in-out infinite .9s}

/* hero 3 : libs Apple */
.ob-hero-libs{flex-direction:column;gap:11px;perspective:800px}
.ob-applogo{width:78px;height:78px;border-radius:20px;background:#fff!important;display:flex;align-items:center;justify-content:center;margin-bottom:4px;box-shadow:0 10px 26px rgba(0,0,0,.3),inset 0 0 0 .5px rgba(255,255,255,.5);animation:obFloat 4s ease-in-out infinite}
.ob-libcard{display:flex;align-items:center;gap:11px;width:284px;padding:12px 14px;border-radius:18px;
  animation:obSlideIn .5s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:calc(var(--i)*.12s + .15s)}
.ob-libcard.on{box-shadow:var(--grim),0 8px 22px rgba(182,216,75,.3);border-color:rgba(182,216,75,.6)}
.ob-lib-ic{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:#3D5A6C;flex-shrink:0;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.ob-lib-tx{flex:1;min-width:0}
.ob-lib-n{font-size:14px;font-weight:600}
.ob-lib-tag{font-size:10px;font-weight:700;color:rgba(255,255,255,.7);margin-top:1px}
.ob-lib-ck{width:24px;height:24px;border-radius:50%;background:rgba(182,216,75,.6);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
@keyframes obSlideIn{from{opacity:0;transform:translateY(16px) rotateX(20deg)}to{opacity:1;transform:none}}

/* hero 4 : swipe */
.ob-hero-swipe{perspective:900px}
.ob-card{position:absolute;width:188px;height:248px;border-radius:26px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.45);border:.5px solid rgba(255,255,255,.3)}
.ob-card-back{transform:scale(.9) translate(18px,14px) rotate(5deg);opacity:.65}
.ob-card-front{animation:obWiggle 3.4s ease-in-out infinite}
.ob-card-sheen{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.3),transparent 35%,transparent 70%,rgba(255,255,255,.12))}
.ob-swipe-hint{position:absolute;top:14px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.ob-hint-keep{right:12px;background:rgba(182,216,75,.4);box-shadow:var(--grim),0 4px 14px rgba(182,216,75,.5)}
.ob-hint-trash{left:12px;background:rgba(240,106,140,.4);box-shadow:var(--grim),0 4px 14px rgba(240,106,140,.5)}
@keyframes obWiggle{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(22px) rotate(5deg)}60%{transform:translateX(-20px) rotate(-5deg)}}

/* copy */
.ob-copy{text-align:center;max-width:330px}
.ob-kicker{font-size:12px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.7);margin-bottom:10px}
.ob-title{font-size:33px;font-weight:800;letter-spacing:-.03em;line-height:1.06;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.ob-body{font-size:15.5px;line-height:1.5;color:rgba(255,255,255,.82);margin-top:14px}

/* foot */
.ob-foot{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:22px;padding:8px 34px 30px}
.ob-dots{display:flex;gap:8px}
.ob-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);border:none;cursor:pointer;padding:0;transition:width .3s,background .3s}
.ob-dot.on{width:24px;border-radius:5px;background:#fff}
.ob-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:18px;
  color:#fff;font-family:inherit;font-size:16.5px;font-weight:700;cursor:pointer;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.ob-cta-go{background:rgba(182,216,75,.4)!important;box-shadow:var(--grim),0 10px 26px rgba(182,216,75,.4)!important}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="proto/components.jsx"></script>
<script type="text/babel" src="proto/onboarding.jsx"></script>
</body>
</html>
