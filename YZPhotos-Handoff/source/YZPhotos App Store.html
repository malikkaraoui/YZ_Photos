<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YZPhotos — Visuels App Store</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="proto/yz-shared.css">
<style>
  html,body{margin:0;height:100%;background:#0c0c0e}
  #root{height:100%}
  *,*::before,*::after{box-sizing:border-box}

  /* ════ POSTER ════ */
  .poster{position:relative;width:100%;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
    display:flex;flex-direction:column}
  .poster-kicker{font-size:15px;font-weight:700;letter-spacing:.16em;color:#5B5BD6;
    text-transform:uppercase;margin-bottom:14px}
  .poster-h{font-size:54px;font-weight:800;letter-spacing:-.03em;line-height:1.04;color:#16141C}
  .poster-sub{font-size:19px;font-weight:450;line-height:1.45;color:rgba(22,20,28,.6);margin-top:16px}

  /* iPhone poster */
  .poster-phone{align-items:center}
  .poster-copy{text-align:center;padding:60px 56px 0;position:relative;z-index:2;max-width:600px}
  .poster-stage{flex:1;display:flex;align-items:center;justify-content:center;
    position:relative;z-index:1;width:100%;min-height:0;padding-bottom:18px}
  .poster-device{filter:drop-shadow(0 26px 54px rgba(40,30,70,.30))}

  /* iPad poster */
  .poster-pad{flex-direction:row;align-items:center;position:relative}
  .poster-pad-copy{position:absolute;left:0;top:0;bottom:0;width:40%;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 22px 0 78px;z-index:3}
  .poster-h-pad{font-size:52px;max-width:100%}
  .poster-sub-pad{font-size:20px;max-width:100%}
  .poster-pad-stage{position:absolute;left:40%;right:0;top:0;bottom:0;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;z-index:1}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="proto/design-canvas.jsx"></script>
<script type="text/babel" src="proto/components.jsx"></script>
<script type="text/babel" src="proto/screens.jsx"></script>
<script type="text/babel" src="proto/screens-extra.jsx"></script>
<script type="text/babel" src="proto/app-store.jsx"></script>
</body>
</html>
