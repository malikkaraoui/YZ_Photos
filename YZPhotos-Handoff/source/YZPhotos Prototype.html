<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YZPhotos — Prototype écrans clés</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
/* ════════════ TOKENS — Neutre / Linear, accent discret ════════════ */
.app-root[data-theme="light"]{
  --bg:#FFFFFF; --bg2:#F4F4F6; --bg3:#ECECEF; --card:#FFFFFF; --elev:#FFFFFF;
  --sep:rgba(0,0,0,.075); --sep2:rgba(0,0,0,.12);
  --t1:#161618; --t2:#6A6A70; --t3:#A0A0A8;
  --accent:#5B5BD6; --accent-soft:#ECECFB;
  --keep:#28B463; --keep-soft:#E6F7EE;
  --trash:#E5484D; --trash-soft:#FCEBEC;
  --warn:#E08600; --warn-soft:#FBF1E0;
  --chrome-screen:#F4F4F6;
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.07);
  --shadow-deck:0 8px 24px rgba(0,0,0,.1),0 24px 60px rgba(0,0,0,.13);
  --shadow-float:0 2px 8px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.12);
}
.app-root[data-theme="dark"]{
  --bg:#0C0C0E; --bg2:#161618; --bg3:#202024; --card:#161618; --elev:#1C1C20;
  --sep:rgba(255,255,255,.08); --sep2:rgba(255,255,255,.14);
  --t1:#F4F4F6; --t2:#9A9AA2; --t3:#5E5E66;
  --accent:#8A88FF; --accent-soft:#22223A;
  --keep:#3DD27F; --keep-soft:#11271C;
  --trash:#FF5C61; --trash-soft:#2C1314;
  --warn:#F5A623; --warn-soft:#2A2010;
  --chrome-screen:#0C0C0E;
  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --shadow-deck:0 12px 32px rgba(0,0,0,.55),0 30px 70px rgba(0,0,0,.5);
  --shadow-float:0 2px 12px rgba(0,0,0,.5);
}
/* root-wrap controls chrome (always dark stage) */
.root-wrap[data-theme]{ --stage-bg:#0a0a0c; }

/* ════════════ THÈME VERRE / LIQUID GLASS ════════════ */
.app-root[data-theme="glass"]{
  --t1:#FFFFFF; --t2:rgba(255,255,255,.82); --t3:rgba(255,255,255,.58);
  --sep:rgba(255,255,255,.16); --sep2:rgba(255,255,255,.3);
  --bg:transparent; --bg2:rgba(255,255,255,.12); --bg3:rgba(255,255,255,.18);
  --card:rgba(255,255,255,.14); --elev:rgba(40,62,74,.6);
  --accent:#FFFFFF; --accent-soft:rgba(255,255,255,.22);
  --keep:#B6D84B; --keep-soft:rgba(182,216,75,.28);
  --trash:#F06A8C; --trash-soft:rgba(240,106,140,.28);
  --warn:#F0B43E; --warn-soft:rgba(240,180,62,.26);
  --chrome-screen:#1a3543;
  --gbrd:rgba(255,255,255,.42);
  --grim:inset 0 .5px .5px rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.16);
  --gdrop:0 8px 24px rgba(8,28,38,.3);
  --shadow-card:var(--grim),var(--gdrop);
  --shadow-deck:0 18px 50px rgba(8,28,38,.5);
  --shadow-float:var(--grim),0 12px 30px rgba(8,28,38,.4);
  background:linear-gradient(165deg,#3A5C6E 0%,#244252 48%,#152D3A 100%);
  position:relative;
}
.app-root[data-theme="glass"]::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 30% at 14% 16%, rgba(232,123,62,.5), transparent 70%),
    radial-gradient(34% 28% at 88% 12%, rgba(195,210,74,.4), transparent 70%),
    radial-gradient(44% 38% at 90% 90%, rgba(178,58,93,.48), transparent 72%),
    radial-gradient(40% 34% at 8% 92%, rgba(232,138,160,.4), transparent 72%);
  filter:blur(10px);
}
.app-root[data-theme="glass"] > *{position:relative;z-index:1}
.app-root[data-theme="glass"] .tabbar-bottom,
.app-root[data-theme="glass"] .round-btn,
.app-root[data-theme="glass"] .btn-secondary,
.app-root[data-theme="glass"] .dup-foot,
.app-root[data-theme="glass"] .trash-banner,
.app-root[data-theme="glass"] .modal{
  background:rgba(255,255,255,.14)!important;
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:.5px solid var(--gbrd);box-shadow:var(--grim),var(--gdrop)}
.app-root[data-theme="glass"] .drivebar{background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.app-root[data-theme="glass"] .btn-destructive{background:rgba(240,106,140,.42)!important;color:#fff;border:.5px solid var(--gbrd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--grim),0 8px 20px rgba(240,106,140,.4)}
.app-root[data-theme="glass"] .rb-keep{background:rgba(182,216,75,.34)!important;color:#fff;box-shadow:var(--grim),0 8px 22px rgba(182,216,75,.45)}
.app-root[data-theme="glass"] .rb-trash{background:rgba(240,106,140,.34)!important;color:#fff;box-shadow:var(--grim),0 8px 22px rgba(240,106,140,.45)}
.app-root[data-theme="glass"] .rb-undo{color:#fff}
.app-root[data-theme="glass"] .badge,
.app-root[data-theme="glass"] .best-badge{background:rgba(255,255,255,.2)!important;color:#fff!important;border:.5px solid var(--gbrd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.app-root[data-theme="glass"] .badge-accent{background:rgba(232,123,62,.34)!important}
.app-root[data-theme="glass"] .tabitem.active{color:#fff}
.app-root[data-theme="glass"] .tabitem{color:rgba(255,255,255,.6)}
.app-root[data-theme="glass"] .prog{background:rgba(255,255,255,.22)}
.app-root[data-theme="glass"] .prog-accent,
.app-root[data-theme="glass"] .prog-keep{background:linear-gradient(90deg,#fff,rgba(255,255,255,.85))}
.app-root[data-theme="glass"] .tc-num,
.app-root[data-theme="glass"] .dup-sim,
.app-root[data-theme="glass"] .scr-title,
.app-root[data-theme="glass"] .statusbar{color:#fff}
.app-root[data-theme="glass"] .dup-item.is-best .thumb{outline-color:#F0B43E}
.app-root[data-theme="glass"] .dup-item.is-sel .thumb{outline-color:#F06A8C}
.app-root[data-theme="glass"] .sel-check.on{background:#F06A8C}
.app-root[data-theme="glass"] .empty-icon{background:rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:.5px solid var(--gbrd);color:#fff}
.app-root[data-theme="glass"] .restore-btn{background:rgba(255,255,255,.14)!important;border:.5px solid var(--gbrd);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.app-root[data-theme="glass"] .trash-row{border-bottom:.5px solid var(--sep)}
.app-root[data-theme="glass"] .modal-reassure{color:#D8EE9A}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased;background:#08080A;overflow:hidden}

/* ════════════ CHROME ════════════ */
.root-wrap{height:100%;display:flex;flex-direction:column;background:#08080A}
.chrome{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:#111114;border-bottom:1px solid rgba(255,255,255,.07)}
.chrome-brand{display:flex;align-items:center;gap:12px}
.cb-logo{font-size:15px;font-weight:600;letter-spacing:-.01em;color:#fff}
.cb-logo b{font-weight:700;color:#8A88FF}
.cb-tag{font-size:12px;color:rgba(255,255,255,.4)}
.chrome-controls{display:flex;gap:10px}
.seg2{display:flex;background:rgba(255,255,255,.08);border-radius:9px;padding:2px;gap:2px}
.seg2 button{border:none;background:transparent;color:rgba(255,255,255,.55);
  font-family:inherit;font-size:12.5px;font-weight:500;padding:5px 13px;border-radius:7px;
  cursor:pointer;transition:all .15s;white-space:nowrap}
.seg2 button.on{background:rgba(255,255,255,.14);color:#fff}

/* ════════════ STAGE ════════════ */
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:
    radial-gradient(120% 100% at 50% 0%, #15151a 0%, #0a0a0c 60%);transition:background .3s}
.frame-holder{transform-origin:center center;transition:transform .25s ease}

/* ════════════ DEVICE : iPhone ════════════ */
.iphone{width:402px;height:842px;background:#000;border-radius:56px;padding:13px;
  box-shadow:0 0 0 2px #2a2a2e,0 40px 80px rgba(0,0,0,.6);position:relative}
.iphone-screen{width:100%;height:100%;border-radius:44px;overflow:hidden;position:relative;background:var(--bg)}

/* ════════════ DEVICE : iPad 13" paysage ════════════ */
.ipad{width:1180px;height:838px;background:#0a0a0c;border-radius:30px;padding:14px;
  box-shadow:0 0 0 2px #2a2a2e,0 40px 90px rgba(0,0,0,.6);position:relative}
.ipad-screen{width:100%;height:100%;border-radius:18px;overflow:hidden;position:relative;background:var(--bg)}

/* ════════════ APP ROOT ════════════ */
.app-root{width:100%;height:100%;background:var(--bg);color:var(--t1);
  display:flex;flex-direction:column;position:relative;transition:background .25s,color .25s}

/* ── Status bar ── */
.statusbar{height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;color:var(--t1);font-size:14px;position:relative;z-index:5}
.statusbar.sb-compact{padding:0 34px;height:48px;align-items:flex-start;padding-top:14px}
.sb-time{font-weight:600;font-size:15px}
.sb-island{position:absolute;left:50%;top:11px;transform:translateX(-50%);
  width:108px;height:30px;background:#000;border-radius:18px}
.sb-right{display:flex;align-items:center;gap:6px}

/* ── Drive bar ── */
.drivebar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:9px 22px;
  border-bottom:1px solid var(--sep);color:var(--t2);font-size:13px}
.drivebar.db-compact{padding:7px 18px}
.db-left{display:flex;align-items:center;gap:8px;color:var(--t1);font-weight:500}
.db-dot{width:8px;height:8px;border-radius:50%;background:var(--keep);
  box-shadow:0 0 0 3px var(--keep-soft)}
.db-name{font-size:13.5px}
.db-meta{color:var(--t3);font-size:12.5px}
.db-eject{margin-left:auto;background:transparent;border:none;color:var(--t2);cursor:pointer;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s}
.db-eject:hover{background:var(--bg2)}

/* ── App body ── */
.app-body{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}

/* ════════════ iPad tab bar flottante ════════════ */
.tabbar-float-wrap{flex-shrink:0;display:flex;justify-content:center;padding:10px 0 6px}
.tabbar-float{display:flex;align-items:center;gap:2px;background:var(--bg2);
  border:1px solid var(--sep);border-radius:16px;padding:5px;box-shadow:var(--shadow-float)}
.floatitem{display:flex;align-items:center;gap:7px;border:none;background:transparent;
  color:var(--t2);font-family:inherit;font-size:13.5px;font-weight:500;
  padding:8px 15px;border-radius:11px;cursor:pointer;transition:all .15s}
.floatitem:hover{color:var(--t1)}
.floatitem.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow-card);font-weight:600}
.float-sep{width:1px;height:22px;background:var(--sep2);margin:0 4px}
.floatitem-more{color:var(--t3)}

/* ════════════ iPhone tab bar bas ════════════ */
.tabbar-bottom{flex-shrink:0;display:flex;justify-content:space-around;align-items:flex-start;
  padding:8px 6px 24px;border-top:1px solid var(--sep);background:var(--bg);
  backdrop-filter:blur(20px)}
.tabitem{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;
  color:var(--t3);font-family:inherit;font-size:10px;font-weight:500;cursor:pointer;
  padding:2px 4px;flex:1;transition:color .15s}
.tabitem.active{color:var(--accent)}

/* ════════════ SCREEN GÉNÉRIQUE ════════════ */
.scr{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.scr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:18px 30px 14px}
.sb-compact ~ .app-body .scr-head,
.iphone .scr-head{padding:14px 20px 12px}
.scr-title{font-size:30px;font-weight:700;letter-spacing:-.025em;color:var(--t1);line-height:1}
.iphone .scr-title{font-size:28px}
.scr-sub{font-size:14px;color:var(--t2);margin-top:5px}

/* ════════════ TRIER ════════════ */
.trier{align-items:stretch}
.trier-count{display:flex;align-items:baseline;gap:3px}
.tc-num{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:-.02em}
.tc-tot{font-size:15px;color:var(--t3);font-weight:500}
.trier-prog{padding:0 30px 8px}
.iphone .trier-prog{padding:0 20px 8px}
.deck{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  padding:14px 30px;min-height:0}
.iphone .deck{padding:10px 22px}
.card-photo{position:absolute;width:min(78%,560px);aspect-ratio:4/3;border-radius:24px;
  overflow:hidden;box-shadow:var(--shadow-deck);user-select:none;touch-action:none}
.iphone .card-photo{width:88%;aspect-ratio:3/4}
.card-behind{transform:scale(.93) translateY(16px);filter:saturate(.9) brightness(.97);opacity:.85}
.card-front{cursor:grab;z-index:2}
.card-front.dragging{cursor:grabbing}
.card-front:not(.dragging):not(.flyout){transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.card-front.flyout{transition:transform .28s ease-in;opacity:0}
.card-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
.card-tint{position:absolute;inset:0;pointer-events:none}
.tint-keep{background:var(--keep)}
.tint-trash{background:var(--trash)}
.swipe-label{position:absolute;top:26px;font-size:26px;font-weight:800;letter-spacing:.06em;
  padding:7px 16px;border-radius:12px;border:3.5px solid;color:#fff;z-index:3;pointer-events:none}
.sl-keep{right:24px;border-color:#fff;background:rgba(40,180,99,.35);transform:rotate(8deg)}
.sl-trash{left:24px;border-color:#fff;background:rgba(229,72,77,.35);transform:rotate(-8deg)}
.card-meta{position:absolute;left:0;right:0;bottom:0;padding:18px 20px;color:#fff;z-index:2}
.card-type{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;
  text-shadow:0 1px 4px rgba(0,0,0,.4)}
.card-info{font-size:12.5px;opacity:.85;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.trier-actions{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:22px;
  padding:8px 30px 26px}
.iphone .trier-actions{padding:6px 20px 20px;gap:18px}
.round-btn{border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:var(--card);box-shadow:var(--shadow-card);transition:transform .12s,background .15s;
  border:1px solid var(--sep)}
.round-btn:active{transform:scale(.92)}
.round-btn:disabled{opacity:.4;cursor:default}
.rb-trash{width:62px;height:62px;color:var(--trash)}
.rb-keep{width:62px;height:62px;color:var(--keep)}
.rb-undo{width:50px;height:50px;color:var(--t2)}
.iphone .rb-trash,.iphone .rb-keep{width:58px;height:58px}
.iphone .rb-undo{width:46px;height:46px}
.rb-trash:hover{background:var(--trash-soft)}
.rb-keep:hover{background:var(--keep-soft)}

/* ════════════ DOUBLONS ════════════ */
.dup-scroll{flex:1;overflow-y:auto;padding:4px 30px 8px;display:flex;flex-direction:column;gap:22px}
.iphone .dup-scroll{padding:4px 18px 8px;gap:18px}
.dup-group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dup-sim{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent)}
.dup-grp-meta{font-size:12.5px;color:var(--t3)}
.dup-row{display:flex;gap:12px}
.dup-row-compact{flex-wrap:wrap}
.dup-item{position:relative;flex:1;min-width:0;border:none;background:transparent;padding:0;cursor:pointer;
  text-align:left;border-radius:12px;transition:transform .12s}
.dup-row-compact .dup-item{flex:0 0 calc(50% - 6px)}
.dup-item:active{transform:scale(.97)}
.dup-item:disabled{cursor:default}
.dup-item .thumb{width:100%;aspect-ratio:1;outline:2.5px solid transparent;outline-offset:2px;
  transition:outline-color .15s,opacity .15s}
.dup-item.is-best .thumb{outline-color:var(--warn)}
.dup-item.is-sel .thumb{opacity:.5;outline-color:var(--trash)}
.best-badge{position:absolute;top:7px;left:7px;display:flex;align-items:center;gap:4px;
  background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sel-check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
  background:rgba(0,0,0,.3);border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff}
.sel-check.on{background:var(--trash);border-color:#fff}
.dup-item-meta{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:8px 2px 0}
.dim-size{font-size:13px;font-weight:600;color:var(--t1)}
.dim-res{font-size:11px;color:var(--t3)}
.dup-foot{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 30px;border-top:1px solid var(--sep);background:var(--bg)}
.iphone .dup-foot{padding:12px 18px;flex-direction:column;align-items:stretch;gap:10px}
.dup-foot-info{display:flex;flex-direction:column;gap:1px}
.dup-foot-count{font-size:14px;font-weight:600;color:var(--t1)}
.dup-foot-size{font-size:12.5px;color:var(--t2)}

/* ════════════ CORBEILLE ════════════ */
.trash-banner{display:flex;align-items:flex-start;gap:10px;margin:0 30px 14px;padding:12px 14px;
  background:var(--accent-soft);border-radius:12px;color:var(--accent);font-size:13px;line-height:1.45}
.iphone .trash-banner{margin:0 18px 12px}
.trash-banner svg{flex-shrink:0;margin-top:1px}
.trash-list{flex:1;overflow-y:auto;padding:0 30px 14px;display:flex;flex-direction:column;gap:2px}
.iphone .trash-list{padding:0 18px 14px}
.trash-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--sep)}
.trash-row:last-child{border-bottom:none}
.trash-row .thumb{width:52px;height:52px;flex-shrink:0}
.trash-info{flex:1;min-width:0}
.trash-name{font-size:15px;font-weight:500;color:var(--t1)}
.trash-sub{font-size:12.5px;color:var(--t3);margin-top:2px}
.restore-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--sep2);background:transparent;
  color:var(--accent);font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;
  cursor:pointer;transition:background .15s;flex-shrink:0}
.restore-btn:hover{background:var(--accent-soft)}

/* ════════════ PRIMITIVES ════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;
  font-family:inherit;font-weight:600;cursor:pointer;border-radius:12px;transition:all .15s;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn-md{font-size:14px;padding:9px 16px}
.btn-lg{font-size:15.5px;padding:13px 22px}
.btn-full{width:100%}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-secondary{background:var(--bg2);color:var(--t1);border:1px solid var(--sep)}
.btn-secondary:hover:not(:disabled){background:var(--bg3)}
.btn-destructive{background:var(--trash);color:#fff}
.btn-destructive:hover:not(:disabled){filter:brightness(1.06)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
  padding:5px 11px;border-radius:100px;white-space:nowrap}
.badge-neutral{background:var(--bg3);color:var(--t2)}
.badge-accent{background:var(--accent-soft);color:var(--accent)}
.badge-keep{background:var(--keep-soft);color:var(--keep)}
.badge-trash{background:var(--trash-soft);color:var(--trash)}

.prog{height:6px;background:var(--bg3);border-radius:100px;overflow:hidden}
.prog-fill{height:100%;border-radius:100px;transition:width .4s ease}
.prog-accent{background:var(--accent)}
.prog-keep{background:var(--keep)}

.thumb{position:relative;overflow:hidden;background:var(--bg3)}
.thumb-badge{position:absolute;bottom:6px;right:6px;width:20px;height:20px;border-radius:6px;
  background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px;gap:6px}
.empty-icon{width:80px;height:80px;border-radius:50%;background:var(--bg2);color:var(--t3);
  display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.empty-title{font-size:20px;font-weight:700;color:var(--t1);letter-spacing:-.01em}
.empty-sub{font-size:14px;color:var(--t2);max-width:320px;line-height:1.5}

/* ════════════ MODAL ════════════ */
.modal-scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:30px;
  animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--elev);border-radius:22px;padding:26px;width:min(380px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px}
.modal-icon-danger{background:var(--trash-soft);color:var(--trash)}
.modal-title{font-size:20px;font-weight:700;color:var(--t1);letter-spacing:-.01em;margin-bottom:10px}
.modal-body{font-size:14px;color:var(--t2);line-height:1.5;margin-bottom:20px}
.modal-body p{margin-bottom:9px}
.modal-body b{color:var(--t1);font-weight:600}
.modal-reassure{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--keep);font-weight:500}
.modal-warn{font-size:12.5px;color:var(--t3);font-style:italic;margin-bottom:0}
.modal-actions{display:flex;gap:10px}

/* scrollbars discrètes */
.dup-scroll::-webkit-scrollbar,.trash-list::-webkit-scrollbar{width:6px}
.dup-scroll::-webkit-scrollbar-thumb,.trash-list::-webkit-scrollbar-thumb{background:var(--sep2);border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="proto/components.jsx"></script>
<script type="text/babel" src="proto/screens.jsx"></script>
<script type="text/babel" src="proto/app.jsx"></script>
</body>
