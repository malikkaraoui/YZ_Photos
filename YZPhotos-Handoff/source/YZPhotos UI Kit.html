<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YZPhotos — UI Kit</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="proto/yz-shared.css">
<style>
/* tokens — repris de yz-shared, portés sur .kit pour que les classes composant résolvent */
.kit[data-theme="light"]{
  --bg:#FFFFFF; --bg2:#F4F4F6; --bg3:#ECECEF; --card:#FFFFFF; --elev:#FFFFFF;
  --sep:rgba(0,0,0,.075); --sep2:rgba(0,0,0,.12);
  --t1:#161618; --t2:#6A6A70; --t3:#A0A0A8;
  --accent:#5B5BD6; --accent-soft:#ECECFB;
  --keep:#28B463; --keep-soft:#E6F7EE;
  --trash:#E5484D; --trash-soft:#FCEBEC;
  --warn:#E08600; --warn-soft:#FBF1E0;
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.07);
  --shadow-float:0 2px 8px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.12);
  --page:#F7F7F9; --ink:#161618; --ink2:#6A6A70; --ink3:#A0A0A8;
  --panel:#FFFFFF; --line:rgba(0,0,0,.08);
}
.kit[data-theme="dark"]{
  --bg:#0C0C0E; --bg2:#161618; --bg3:#202024; --card:#161618; --elev:#1C1C20;
  --sep:rgba(255,255,255,.08); --sep2:rgba(255,255,255,.14);
  --t1:#F4F4F6; --t2:#9A9AA2; --t3:#5E5E66;
  --accent:#8A88FF; --accent-soft:#22223A;
  --keep:#3DD27F; --keep-soft:#11271C;
  --trash:#FF5C61; --trash-soft:#2C1314;
  --warn:#F5A623; --warn-soft:#2A2010;
  --shadow-card:0 1px 2px rgba(0,0,0,.4);
  --shadow-float:0 2px 12px rgba(0,0,0,.5);
  --page:#0A0A0C; --ink:#F4F4F6; --ink2:#9A9AA2; --ink3:#5E5E66;
  --panel:#161618; --line:rgba(255,255,255,.08);
}
.kit[data-theme="glass"]{
  --bg:transparent; --bg2:rgba(255,255,255,.12); --bg3:rgba(255,255,255,.18);
  --card:rgba(255,255,255,.14); --elev:rgba(40,62,74,.6);
  --sep:rgba(255,255,255,.16); --sep2:rgba(255,255,255,.3);
  --t1:#FFFFFF; --t2:rgba(255,255,255,.82); --t3:rgba(255,255,255,.58);
  --accent:#FFFFFF; --accent-soft:rgba(255,255,255,.22);
  --keep:#B6D84B; --keep-soft:rgba(182,216,75,.28);
  --trash:#F06A8C; --trash-soft:rgba(240,106,140,.28);
  --warn:#F0B43E; --warn-soft:rgba(240,180,62,.26);
  --shadow-card:inset 0 .5px .5px rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.16), 0 8px 24px rgba(8,28,38,.3);
  --shadow-float:inset 0 .5px .5px rgba(255,255,255,.9), 0 12px 30px rgba(8,28,38,.4);
  --ink:#FFFFFF; --ink2:rgba(255,255,255,.82); --ink3:rgba(255,255,255,.6);
  --panel:rgba(255,255,255,.13); --line:rgba(255,255,255,.32);
  --page:#244252;
}
.kit[data-theme="glass"]{position:relative;
  background:linear-gradient(165deg,#3A5C6E 0%,#244252 48%,#152D3A 100%)}
.kit[data-theme="glass"]::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(30% 24% at 12% 14%, rgba(232,123,62,.45), transparent 70%),
    radial-gradient(28% 22% at 88% 10%, rgba(195,210,74,.36), transparent 70%),
    radial-gradient(34% 30% at 90% 88%, rgba(178,58,93,.42), transparent 72%),
    radial-gradient(32% 28% at 8% 92%, rgba(232,138,160,.36), transparent 72%);
  filter:blur(12px)}
.kit[data-theme="glass"] > *{position:relative;z-index:1}
/* panneaux & surfaces en verre */
.kit[data-theme="glass"] .k-panel,
.kit[data-theme="glass"] .k-principle,
.kit[data-theme="glass"] .cmp,
.kit[data-theme="glass"] .ic-cell,
.kit[data-theme="glass"] .sh,
.kit[data-theme="glass"] .demo-list,
.kit[data-theme="glass"] .brand-ic{
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:.5px solid var(--line)}
.kit[data-theme="glass"] .k-hdr{background:rgba(36,66,82,.5)}
.kit[data-theme="glass"] .btn-primary{background:rgba(232,123,62,.42);color:#fff;border:.5px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.kit[data-theme="glass"] .btn-secondary{background:rgba(255,255,255,.14);color:#fff;border:.5px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.kit[data-theme="glass"] .btn-destructive{background:rgba(240,106,140,.42);color:#fff;border:.5px solid var(--line)}
.kit[data-theme="glass"] .badge,
.kit[data-theme="glass"] .fmt-chip,
.kit[data-theme="glass"] .lib-tag{background:rgba(255,255,255,.2);color:#fff;border:.5px solid var(--line)}
.kit[data-theme="glass"] .tog{background:rgba(255,255,255,.2)}
.kit[data-theme="glass"] .tog.on{background:rgba(182,216,75,.55)}
.kit[data-theme="glass"] .mini-seg{background:rgba(255,255,255,.14);border:.5px solid var(--line)}
.kit[data-theme="glass"] .mini-seg span{color:rgba(255,255,255,.75)}
.kit[data-theme="glass"] .mini-seg span.on{background:rgba(255,255,255,.3);color:#fff}
.kit[data-theme="glass"] .source-ic.lib{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.3)}
.kit[data-theme="glass"] .k-toggle{background:rgba(255,255,255,.12);border:.5px solid var(--line)}
.kit[data-theme="glass"] .k-toggle button.on{background:rgba(255,255,255,.28);color:#fff}
.kit[data-theme="glass"] .k-pill{background:rgba(255,255,255,.2);color:#fff}
.kit[data-theme="glass"] .prog{background:rgba(255,255,255,.22)}
.kit[data-theme="glass"] .prog-accent{background:linear-gradient(90deg,#fff,rgba(255,255,255,.85))}
.kit[data-theme="glass"] .rad-box{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.5)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
.kit{background:var(--page);color:var(--ink);min-height:100vh;transition:background .25s,color .25s}

/* header */
.k-hdr{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;gap:14px;
  padding:0 40px;background:color-mix(in srgb,var(--page) 86%,transparent);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)}
.k-logo{font-size:16px;font-weight:700;letter-spacing:-.01em}
.k-logo b{color:var(--accent)}
.k-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;background:var(--accent-soft);color:var(--accent)}
.k-sp{flex:1}
.k-toggle{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.k-toggle button{border:none;background:transparent;color:var(--ink2);font-family:inherit;font-size:13px;font-weight:500;padding:6px 14px;border-radius:7px;cursor:pointer}
.k-toggle button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-card)}

.k-body{max-width:1040px;margin:0 auto;padding:48px 40px 100px}
.k-hero h1{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1}
.k-hero p{font-size:17px;color:var(--ink2);margin-top:12px;max-width:580px;line-height:1.5}
.k-principles{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.k-principle{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.k-principle .pt{font-size:15px;font-weight:700;margin-bottom:4px}
.k-principle .pd{font-size:13px;color:var(--ink2);line-height:1.45}

.k-section{margin-top:64px}
.k-tag{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.k-h{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.k-sub{font-size:14.5px;color:var(--ink2);margin-bottom:24px;max-width:560px}
.k-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow-card)}
.k-panel + .k-panel{margin-top:16px}
.k-panel-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:16px}

/* colors */
.sw-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:720px){.sw-grid{grid-template-columns:repeat(3,1fr)}}
.sw{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sw-c{height:56px}
.sw-i{padding:7px 9px}
.sw-n{font-size:12px;font-weight:600}
.sw-h{font-size:10.5px;color:var(--ink2);font-family:'SF Mono',monospace;margin-top:1px}

/* type */
.type-row{display:flex;align-items:baseline;gap:20px;padding:11px 0;border-bottom:1px solid var(--line)}
.type-row:last-child{border-bottom:none}
.type-meta{font-size:11px;font-family:'SF Mono',monospace;color:var(--ink3);white-space:nowrap;width:150px;flex-shrink:0}

/* radius/shadow */
.rad-row{display:flex;gap:22px;flex-wrap:wrap}
.rad{display:flex;flex-direction:column;align-items:center;gap:8px}
.rad-box{width:64px;height:64px;background:var(--accent-soft);border:2px solid var(--accent)}
.rad-l{font-size:11px;color:var(--ink2);text-align:center;line-height:1.35}
.sh-row{display:flex;gap:18px;flex-wrap:wrap}
.sh{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;font-size:13px;font-weight:600}

/* icons */
.ic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ic-cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--bg2)}
.ic-cell .nm{font-size:9.5px;color:var(--ink3);font-family:'SF Mono',monospace;text-align:center;word-break:break-all;line-height:1.3}

/* components showcase */
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.cmp-grid{grid-template-columns:1fr}}
.cmp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow-card)}
.cmp-l{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:16px}
.cmp-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cmp-row + .cmp-row{margin-top:12px}

/* toggle + seg reused from yz-shared via .tog/.mini-seg */
.demo-list{background:var(--bg2);border-radius:12px;overflow:hidden}

/* app icon */
.brand-row{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.brand-ic{width:120px;height:120px;border-radius:27px;overflow:hidden;box-shadow:var(--shadow-float)}
.brand-ic img{display:block;width:100%;height:100%}
.brand-txt h3{font-size:18px;font-weight:700;margin-bottom:6px}
.brand-txt p{font-size:14px;color:var(--ink2);line-height:1.5;max-width:420px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="proto/components.jsx"></script>
<script type="text/babel" src="proto/ui-kit.jsx"></script>
</body>
</html>
