<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YZPhotos — Micro-interactions</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --mi-keep:#B6D84B; --mi-trash:#F06A8C;
  --gbrd:rgba(255,255,255,.42);
  --grim:inset 0 .5px .5px rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.16);
  --gdrop:0 8px 24px rgba(8,28,38,.32);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.glass-m{background:rgba(255,255,255,.12);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:.5px solid var(--gbrd);box-shadow:var(--grim),var(--gdrop)}

/* stage */
.mi-stage{height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(160deg,#3A5C6E 0%,#244252 45%,#152D3A 100%);padding:24px 34px 30px}
.mi-blobs{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(38% 30% at 14% 16%, rgba(232,123,62,.48), transparent 70%),
  radial-gradient(34% 28% at 88% 12%, rgba(195,210,74,.4), transparent 70%),
  radial-gradient(44% 38% at 90% 92%, rgba(178,58,93,.46), transparent 72%),
  radial-gradient(40% 34% at 8% 90%, rgba(232,138,160,.4), transparent 72%);filter:blur(8px)}
.mi-head{position:relative;z-index:2;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mi-logo{font-size:17px;font-weight:700;color:#fff}
.mi-pill{font-size:12px;font-weight:600;color:#fff;padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.18);border:.5px solid rgba(255,255,255,.35)}
.mi-cols{position:relative;z-index:1;flex:1;display:flex;gap:54px;align-items:center;justify-content:center;min-height:0}

/* phone */
.mi-phone-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;flex-shrink:0}
.mi-phone{width:340px;height:710px;border-radius:50px;padding:10px;
  background:linear-gradient(160deg,rgba(255,255,255,.25),rgba(255,255,255,.05));
  box-shadow:0 0 0 1.5px rgba(255,255,255,.35),0 40px 90px rgba(0,0,0,.45)}
.mi-phone-screen{width:100%;height:100%;border-radius:40px;overflow:hidden;position:relative;background:#16323f}
.mi-hint-drag{font-size:13px;color:rgba(255,255,255,.6);font-weight:500}

.mi-scr{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff;overflow:hidden;
  background:linear-gradient(165deg,#3A5C6E,#1c3a48)}
.mi-scr-bg{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(50% 36% at 82% 6%, rgba(232,123,62,.4), transparent 70%),
  radial-gradient(54% 42% at 10% 94%, rgba(178,58,93,.42), transparent 72%);filter:blur(6px)}
.mi-statusbar{position:relative;z-index:2;display:flex;justify-content:space-between;padding:15px 26px 0;font-size:14px;font-weight:600}
.mi-sb{opacity:.8}
.mi-deck{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:18px}
.mi-card{position:absolute;width:84%;aspect-ratio:3/4;border-radius:28px;overflow:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.45);border:.5px solid rgba(255,255,255,.3);touch-action:none}
.mi-card-back{transform:scale(.92) translateY(16px);opacity:.6}
.mi-card-front{cursor:grab;z-index:2}
.mi-card-front.grab{cursor:grabbing}
.mi-card-front.fly{opacity:0;transition:transform .34s ease-in,opacity .34s ease-in!important}
.mi-sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.28),transparent 34%,transparent 70%,rgba(255,255,255,.12))}
.mi-tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay}
.mi-tint-keep{background:var(--mi-keep)} .mi-tint-trash{background:var(--mi-trash)}
.mi-stamp{position:absolute;top:22px;padding:7px 15px;border-radius:13px;font-size:21px;font-weight:800;letter-spacing:.05em;color:#fff;
  border:2.5px solid #fff;text-shadow:0 1px 5px rgba(0,0,0,.3);pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mi-stamp-keep{right:18px;background:rgba(182,216,75,.4)}
.mi-stamp-trash{left:18px;background:rgba(240,106,140,.4)}
.mi-actions{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:20px;padding:10px 0 26px}
.mi-rb{border-radius:50%;border:.5px solid var(--gbrd);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;
  background:rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:var(--grim),var(--gdrop);transition:transform .12s}
.mi-rb:active{transform:scale(.92)}
.mi-rb:disabled{opacity:.4}
.mi-rb-trash{width:60px;height:60px;background:rgba(240,106,140,.3)!important;box-shadow:var(--grim),0 8px 22px rgba(240,106,140,.45)}
.mi-rb-keep{width:60px;height:60px;background:rgba(182,216,75,.3)!important;box-shadow:var(--grim),0 8px 22px rgba(182,216,75,.45)}
.mi-rb-undo{width:48px;height:48px}

/* panel */
.mi-panel{width:430px;flex-shrink:0;color:#fff}
.mi-tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.mi-h{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:5px 0 8px;text-shadow:0 2px 12px rgba(0,0,0,.2)}
.mi-sub{font-size:15px;line-height:1.5;color:rgba(255,255,255,.78);margin-bottom:24px;max-width:400px}

.mi-states{display:flex;flex-direction:column;gap:4px;margin-bottom:20px}
.mi-state{display:flex;gap:13px;padding:12px 14px;border-radius:14px;align-items:flex-start;transition:background .25s,box-shadow .25s;border:.5px solid transparent}
.mi-state.on{background:rgba(255,255,255,.14);border-color:var(--gbrd);box-shadow:var(--grim),var(--gdrop)}
.mi-state-dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.3);margin-top:4px;flex-shrink:0;transition:background .25s,box-shadow .25s}
.mi-state.on .mi-state-dot{background:#fff;box-shadow:0 0 10px 2px rgba(255,255,255,.6)}
.mi-state-t{font-size:15px;font-weight:700}
.mi-state.on .mi-state-t{color:#fff}
.mi-state:not(.on) .mi-state-t{color:rgba(255,255,255,.6)}
.mi-state-d{font-size:12.5px;line-height:1.4;color:rgba(255,255,255,.6);margin-top:2px}

.mi-readout{border-radius:18px;padding:16px 18px;margin-bottom:16px}
.mi-ro-row{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.mi-ro-k{color:rgba(255,255,255,.7);font-weight:600}
.mi-ro-v{font-family:'SF Mono',ui-monospace,monospace;font-size:14px;font-weight:700;color:#fff}
.mi-meter{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.16);margin:12px 0;overflow:hidden}
.mi-meter-mid{position:absolute;left:50%;top:-2px;width:1.5px;height:12px;background:rgba(255,255,255,.5);transform:translateX(-50%)}
.mi-meter-fill{position:absolute;top:0;height:100%;border-radius:5px;transition:none}
.mi-ro-badge{font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:8px}
.mi-ro-badge.idle{background:rgba(255,255,255,.16);color:rgba(255,255,255,.7)}
.mi-ro-badge.keep{background:var(--mi-keep);color:#1c2e0a}
.mi-ro-badge.trash{background:var(--mi-trash);color:#3a0a18}

.mi-specs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi-spec{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.mi-spec b{font-size:13px;font-weight:700}
.mi-spec span{font-size:11.5px;color:rgba(255,255,255,.65);font-family:'SF Mono',ui-monospace,monospace}

@media(max-width:980px){ .mi-cols{flex-direction:column;gap:24px;overflow:auto} .mi-panel{width:340px} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="proto/components.jsx"></script>
<script type="text/babel" src="proto/micro.jsx"></script>
</body>
</html>
