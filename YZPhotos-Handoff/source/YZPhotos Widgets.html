<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YZPhotos — Widgets</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --gbrd:rgba(255,255,255,.45);
  --grim:inset 0 .5px .5px rgba(255,255,255,.9), inset 0 0 0 .5px rgba(255,255,255,.18);
  --gdrop:0 10px 30px rgba(8,28,38,.35);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.glass-w{background:rgba(255,255,255,.16);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:.5px solid var(--gbrd);box-shadow:var(--grim),var(--gdrop)}

/* stage — faux fond d'écran iOS coloré */
.wgs-stage{height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:26px 40px 40px;
  background:linear-gradient(150deg,#E8743B 0%,#B23A5D 38%,#3D5A6C 72%,#1b3340 100%)}
.wgs-blobs{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(36% 30% at 80% 12%, rgba(195,210,74,.5), transparent 70%),
  radial-gradient(40% 34% at 14% 84%, rgba(232,138,160,.5), transparent 72%),
  radial-gradient(30% 26% at 92% 88%, rgba(255,210,90,.4), transparent 70%)}
.wgs-head{position:relative;z-index:2;display:flex;align-items:center;gap:12px;margin-bottom:32px}
.wgs-logo{font-size:17px;font-weight:700;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.wgs-pill{font-size:12px;font-weight:600;color:#fff;padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.2);border:.5px solid rgba(255,255,255,.4)}
.wgs-grid{position:relative;z-index:1;flex:1;display:flex;gap:46px;align-items:center;justify-content:center;flex-wrap:wrap}
.wgs-col{display:flex;flex-direction:column;gap:14px}
.wgs-cap{font-size:12px;font-weight:600;color:rgba(255,255,255,.8);letter-spacing:.02em;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.wgs-row{display:flex;gap:16px}

/* widget base */
.wg{color:#fff;border-radius:26px;position:relative;overflow:hidden}
.wg-s{width:158px;height:158px;padding:16px}
.wg-m{width:332px;height:158px;padding:16px;display:flex;gap:14px}
.wg-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.wg-top{display:flex;align-items:center;gap:6px;margin-bottom:auto}
.wg-appic{width:20px;height:20px;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wg-name{font-size:12px;font-weight:700;opacity:.92}
.wg-big{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:10px}
.wg-lbl{font-size:13px;font-weight:600;opacity:.82}
.wg-foot{display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.78;margin-top:10px}
.wg-dot{width:7px;height:7px;border-radius:50%;background:#B6D84B;box-shadow:0 0 7px 1px #B6D84B}
.wg-ringwrap{position:relative;display:flex;align-items:center;justify-content:center}
.wg-ring-tx{position:absolute;font-size:19px;font-weight:800;letter-spacing:-.02em}
.wg-ring-tx small{font-size:11px;font-weight:600;opacity:.8;margin-left:1px}

/* medium */
.wg-m-l{flex:1;display:flex;flex-direction:column;min-width:0}
.wg-m-stats{display:flex;gap:14px;margin-top:12px}
.wg-m-stats div{display:flex;flex-direction:column}
.wg-m-stats b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.wg-m-stats span{font-size:10.5px;opacity:.75;font-weight:600}
.wg-bar{height:7px;border-radius:5px;background:rgba(255,255,255,.22);margin-top:auto;overflow:hidden}
.wg-bar span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#C3D24A,#B6D84B)}
.wg-sub{font-size:10.5px;opacity:.72;margin-top:6px;font-weight:600}
.wg-m-r{width:96px;display:flex;flex-direction:column;gap:8px}
.wg-thumbs{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px}
.wg-th{border-radius:9px;overflow:hidden;position:relative}
.wg-cta{text-align:center;font-size:12.5px;font-weight:700;padding:7px;border-radius:11px;background:rgba(255,255,255,.2);border:.5px solid var(--gbrd)}

/* lock */
.wg-lock{display:flex;flex-direction:column;align-items:center;gap:14px}
.wg-lock-circ{position:relative;width:60px;height:60px;display:flex;align-items:center;justify-content:center}
.wg-lock-ic{position:absolute;color:#fff}
.wg-lock-inline{display:flex;align-items:center;gap:8px;color:#fff;padding:9px 15px;border-radius:14px;font-size:13.5px;font-weight:700}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="proto/components.jsx"></script>
<script type="text/babel" src="proto/widgets.jsx"></script>
</body>
</html>
