name: YZPhotos
options:
  bundleIdPrefix: com.karaoui
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    from: "3.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.22"
    CURRENT_PROJECT_VERSION: "1"

targets:
  YZPhotos:
    type: application
    platform: iOS
    sources:
      - YZPhotos
    dependencies:
      - package: GRDB
        product: GRDB
      - package: AMSMB2
        product: AMSMB2
        embed: true
        codeSign: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIStatusBarHidden: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K22558HU63
        # Évite le bug "Library not loaded: AMSMB2.framework" au lancement
        # (Xcode « Debug dylib » + framework dynamique SwiftPM).
        ENABLE_DEBUG_DYLIB: "NO"
    info:
      path: YZPhotos/Resources/Info.plist
      properties:
        CFBundleDisplayName: YZPhotos
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "YZPhotos se connecte à ton disque réseau (SMB, ex. Freebox/NAS) sur le réseau local pour lister et trier tes photos et vidéos."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown

  YZPhotosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YZPhotosTests
    dependencies:
      - target: YZPhotos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
