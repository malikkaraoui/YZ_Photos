name: YZPhotos
options:
  developmentLanguage: fr
  bundleIdPrefix: com.karaoui
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    # 4.0.1+ corrige la fuite mémoire de la 3.4.0 (issue #116 : la mémoire
    # escaladait en lisant beaucoup de fichiers) + « optimal read implementation ».
    from: "4.0.3"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.94"
    CURRENT_PROJECT_VERSION: "1"

targets:
  YZPhotos:
    type: application
    platform: iOS
    sources:
      - YZPhotos
    dependencies:
      - package: GRDB
        product: GRDB
      - package: AMSMB2
        product: AMSMB2
        embed: true
        codeSign: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIStatusBarHidden: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K22558HU63
        # Évite le bug "Library not loaded: AMSMB2.framework" au lancement
        # (Xcode « Debug dylib » + framework dynamique SwiftPM).
        ENABLE_DEBUG_DYLIB: "NO"
    info:
      path: YZPhotos/Resources/Info.plist
      properties:
        CFBundleDisplayName: YZPhotos
        # App déclarée en français → iOS traduit ses libellés système
        # (« More » → « Plus », « Back » → « Retour », « Cancel »…).
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "YZPhotos se connecte à ton disque réseau (SMB, ex. Freebox/NAS) sur le réseau local pour lister et trier tes photos et vidéos."
        # App Store : catégorie Photo & vidéo.
        LSApplicationCategoryType: public.app-category.photography
        # Conformité export : pas de chiffrement propriétaire (seulement SMB/HTTPS
        # standards, exemptés) → évite la question à chaque envoi de build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # iPhone : portrait + paysage autorisés dans le bundle ; le verrouillage
        # réel (portrait par défaut) est géré au runtime par l'AppDelegate selon le
        # réglage. iPad : tout, toujours.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  YZPhotosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - YZPhotosTests
    dependencies:
      - target: YZPhotos
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
